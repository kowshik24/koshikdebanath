<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t">
  <title id="t">An orderly ledger of paper tiles where a few tilt up to reveal dark charcoal hollows beneath</title>
  <defs>
    <!-- paper grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="37" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.08  0 0 0 0 0.07  0 0 0 0.05 0"/>
    </filter>
    <!-- hand-drawn ink wobble -->
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="40" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- torn / hand-cut paper edge -->
    <filter id="torn" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.18" numOctaves="3" seed="44" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- soft charcoal shadow -->
    <filter id="soot" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <!-- graphite crosshatch -->
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#141413" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <pattern id="crosshatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#141413" stroke-width="0.6" opacity="0.5"/>
      <line x1="0" y1="0" x2="6" y2="0" stroke="#141413" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#FAF9F5"/>
  <g stroke="#C6C4BA" stroke-width="0.7" filter="url(#ink)">
    <line x1="170.0" y1="134.0" x2="630.0" y2="134.0"/>
    <line x1="170.0" y1="366.0" x2="630.0" y2="366.0"/>
    <line x1="184.0" y1="122.0" x2="184.0" y2="378.0"/>
  </g>
  <rect x="304.0" y="189.0" width="26" height="26" fill="#141413" opacity="0.55" filter="url(#soot)"/>
  <rect x="302.0" y="186.0" width="26" height="26" fill="url(#crosshatch)" filter="url(#ink)"/>
  <rect x="474.0" y="257.0" width="26" height="26" fill="#141413" opacity="0.55" filter="url(#soot)"/>
  <rect x="472.0" y="254.0" width="26" height="26" fill="url(#crosshatch)" filter="url(#ink)"/>
  <rect x="542.0" y="155.0" width="26" height="26" fill="#141413" opacity="0.55" filter="url(#soot)"/>
  <rect x="540.0" y="152.0" width="26" height="26" fill="url(#crosshatch)" filter="url(#ink)"/>
