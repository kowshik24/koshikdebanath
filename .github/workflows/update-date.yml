name: Update Last Modified Date

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.MY_CUSTOM_TOKEN }}

    - name: Update last modified date
      run: |
        # Get current date in the desired format
        CURRENT_DATE=$(date '+%B %d, %Y')
        
        # Update the date in index.html by replacing the "Last updated" text regardless of enclosing tag
        perl -0777 -pe "s/(Last updated: )[^<]*/\$1$CURRENT_DATE/g" -i index.html
        
        # Check if there are changes
        if git diff --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Commit and push changes
        git add index.html
        git commit -m "Auto-update last modified date to $CURRENT_DATE"
        git push
